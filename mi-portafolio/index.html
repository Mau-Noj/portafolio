<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Preconnects (una sola vez) ───────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- ── Fuentes: una sola petición con todas las familias ── -->
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@300;400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- ── Preload imagen hero (mejora LCP) ─────────────────── -->
    <link rel="preload" as="image" href="/inicio.webp" type="image/webp" />

    <!-- ── Favicon ──────────────────────────────────────────── -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- ── Tema: evita flash blanco al cargar en modo oscuro ── -->
    <script>
      (function () {
        var saved = localStorage.getItem("theme");
        var prefer = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (saved === "dark" || (!saved && prefer)) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>

    <!-- ── Analytics ────────────────────────────────────────── -->
    <script
      data-goatcounter="https://mauricionoj.goatcounter.com/count"
      async
      src="//gc.zgo.at/count.js"
      referrerpolicy="no-referrer-when-downgrade"
    ></script>

    <!-- ── SEO ──────────────────────────────────────────────── -->
    <title>Mauricio Noj · Desarrollador Web</title>
    <meta
      name="description"
      content="Portafolio personal de Mauricio Noj — desarrollador web full-stack apasionado por crear experiencias digitales."
    />
    <meta name="author" content="Mauricio Noj" />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://mauricionoj.com" />

    <!-- ── Open Graph ───────────────────────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mauricio Noj" />
    <meta property="og:locale" content="es_GT" />
    <meta property="og:title" content="Mauricio Noj · Desarrollador Web" />
    <meta
      property="og:description"
      content="Portafolio personal de Mauricio Noj — desarrollador web full-stack apasionado por crear experiencias digitales."
    />
    <meta property="og:url" content="https://mauricionoj.com" />
    <meta property="og:image" content="https://mauricionoj.com/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- ── Twitter Card ─────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mauricio Noj · Desarrollador Web" />
    <meta
      name="twitter:description"
      content="Portafolio personal de Mauricio Noj — desarrollador web full-stack apasionado por crear experiencias digitales."
    />
    <meta name="twitter:image" content="https://mauricionoj.com/og-cover.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
