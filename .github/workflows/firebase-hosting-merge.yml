name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - master
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Corregimos la ruta para la instalación y compilación
      - name: Install and Build
        run: npm ci && npm run build
        working-directory: mi-portafolio 

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PORTAFOLIO_MAU }}
          channelId: live
          projectId: portafolio-mau
          entryPoint: mi-portafolio